apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ include "service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "service.name" . }}
    spec:
      serviceAccountName: {{ include "service.fullname" . }}-vso
      {{- if .Values.otel.enabled }}
      initContainers:
        - name: otel-config
          image: {{ .Values.otel.curlImage }}
          command:
            - sh
            - -c
            - curl -fsSL {{ .Values.otel.configUrl }} -o {{ include "service.otelConfigPath" . }}
          volumeMounts:
            - name: {{ .Values.otel.volumeName }}
              mountPath: {{ .Values.otel.mountPath }}
      {{- end }}
      containers:
        - name: {{ include "service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          {{- if .Values.otel.enabled }}
          volumeMounts:
            - name: {{ .Values.otel.volumeName }}
              mountPath: {{ .Values.otel.mountPath }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVICE_NAME
              value: {{ .Values.service | quote }}
            - name: POD_NAMESPACE
              value: {{ .Values.namespace | quote }}
          {{- if (((.Values.java).spring).enabled) }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.java.spring.profile | quote }}
            - name: SPRING_APPLICATION_NAME
              value: {{ .Values.service | quote }}
            - name: SPRING_CLOUD_CONFIG_NAME
              value: {{ include "service.springConfigName" . | quote }}
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{ .Values.java.spring.configUri | quote }}
            {{- if $.Values.otel.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:{{ include "service.otelAgentPath" $ }} -Dotel.config.file={{ include "service.otelConfigPath" $ }}"
            {{- end }}
          {{- end }}
          {{- range .Values.env }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else if hasKey . "fieldPath" }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ .fieldPath }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "service.fullname" $ }}-{{ .secretName }}
                  key: {{ .secretKey }}
              {{- end }}
          {{- end }}
      {{- if .Values.otel.enabled }}
      volumes:
        - name: {{ .Values.otel.volumeName }}
          emptyDir: {}
      {{- end }}
