apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: {{ include "service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "service.name" . }}
    spec:
      serviceAccountName: {{ include "service.fullname" . }}-vso
      containers:
        - name: {{ include "service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVICE_NAME
              value: {{ .Values.service | quote }}
            - name: POD_NAMESPACE
              value: {{ .Values.namespace | quote }}
          {{- if (((.Values.java).spring).enabled) }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.java.spring.profile | quote }}
            - name: SPRING_APPLICATION_NAME
              value: {{ .Values.service | quote }}
            - name: SPRING_CLOUD_CONFIG_NAME
              value: {{ printf "%s,%s" .Values.project .Values.service | quote }}
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{ .Values.java.spring.configUri | default "http://config-service.configuration.svc:8888" | quote }}
          {{- end }}
          {{- range .Values.env }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- else if hasKey . "fieldPath" }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ .fieldPath }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "service.fullname" $ }}-{{ .secretName }}
                  key: {{ .secretKey }}
              {{- end }}
          {{- end }}
