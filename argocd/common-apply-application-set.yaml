apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: common-apply
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/bunnanna/kube-argo.git
      revision: main
      files:
      - path: "common/*/*.yaml"
      - path: "common/*/install/**"
        exclude: true
  template:
    metadata:
      name: '{{.metadata.name}}'
    spec:
      project: default
      sources:
      - repoURL: https://github.com/bunnanna/kube-argo.git
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .metadata "namespace" | default ""}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true