server:
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = 1
      }
      ui = true
      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  ha:
    enabled: false
  service:
    type: ClusterIP
injector:
  enabled: false