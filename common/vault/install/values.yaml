server:
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = 1
      }
      ui = true
      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  ha:
    enabled: false
  service:
    type: ClusterIP

  extraEnvironmentVars:
    VAULT_ADDR: "http://127.0.0.1:8200"

  volumes:
    - name: unseal-keys
      secret:
        secretName: vault-unseal-keys

  volumeMounts:
    - name: unseal-keys
      mountPath: /vault/unseal
      readOnly: true

  postStart:
    - sh
    - -c
    - |
      sleep 5
      vault operator unseal $(cat /vault/unseal/key1)

injector:
  enabled: false
