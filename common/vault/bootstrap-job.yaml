apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-bootstrap
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-bootstrap
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: vault-bootstrap
    namespace: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-bootstrap-script
  namespace: vault
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    export VAULT_ADDR=http://vault.vault.svc:8200

    if vault status -format=json | grep -q '"initialized": false'; then
      INIT=$(vault operator init -key-shares=1 -key-threshold=1 -format=json)
      UNSEAL_KEY=$(echo "$INIT" | jq -r '.unseal_keys_b64[0]')
      ROOT_TOKEN=$(echo "$INIT" | jq -r '.root_token')

      kubectl create secret generic vault-init \
        --namespace vault \
        --from-literal=unseal_key="$UNSEAL_KEY" \
        --from-literal=root_token="$ROOT_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -
    else
      UNSEAL_KEY=$(kubectl get secret vault-init -n vault -o jsonpath='{.data.unseal_key}' | base64 -d)
      ROOT_TOKEN=$(kubectl get secret vault-init -n vault -o jsonpath='{.data.root_token}' | base64 -d)
    fi

    if vault status -format=json | grep -q '"sealed": true'; then
      vault operator unseal "$UNSEAL_KEY"
    fi

    export VAULT_TOKEN="$ROOT_TOKEN"

    vault secrets list -format=json | jq -e 'has("pki/")' >/dev/null 2>&1 || {
      vault secrets enable pki
      vault secrets tune -max-lease-ttl=87600h pki

      vault write -field=certificate pki/root/generate/internal \
        common_name="bunnana.dev" \
        ttl=87600h > /tmp/CA_cert.crt

      vault write pki/config/urls \
        issuing_certificates="http://vault.vault.svc:8200/v1/pki/ca" \
        crl_distribution_points="http://vault.vault.svc:8200/v1/pki/crl"

      vault write pki/roles/cert-manager \
        allowed_domains="bunnana.dev" \
        allow_subdomains=true \
        max_ttl=720h
    }

    vault auth list -format=json | jq -e 'has("kubernetes/")' >/dev/null 2>&1 || {
      vault auth enable kubernetes

      vault write auth/kubernetes/config \
        kubernetes_host="https://kubernetes.default.svc:443"

      vault policy write cert-manager-policy - <<EOF
    path "pki/sign/cert-manager" {
      capabilities = ["create", "update"]
    }
    path "pki/issue/cert-manager" {
      capabilities = ["create"]
    }
    EOF

      vault write auth/kubernetes/role/cert-manager \
        bound_service_account_names=cert-manager \
        bound_service_account_namespaces=cert-manager \
        policies=cert-manager-policy \
        ttl=20m
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.17
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: vault-bootstrap-script
            defaultMode: 0755
