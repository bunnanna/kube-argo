apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: prometheous-grafana-vault-auth
  namespace: monitoring
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: prometheous-grafana-vso
    serviceAccount: prometheous-grafana-vso
    audiences:
      - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheous-grafana-vso
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheous-grafana-vso-token-request
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["prometheous-grafana-vso"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheous-grafana-vso-token-request
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheous-grafana-vso-token-request
subjects:
  - kind: ServiceAccount
    name: prometheous-grafana-vso
    namespace: monitoring
