apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: kong-cors
  annotations:
    kubernetes.io/ingress.class: kong
  labels:
    global: "true"
plugin: cors
config:
  origins:
    - "*"
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Authorization
    - Content-Type
    - X-Trace-Id
  exposed_headers:
    - X-Trace-Id
  credentials: false
  max_age: 3600
