apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  ingressClassName: kong
  tls:
  - hosts:
    - argocd.bunnana.dev
    secretName: argocd-cert-tls
  rules:
  - host: argocd.bunnana.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
